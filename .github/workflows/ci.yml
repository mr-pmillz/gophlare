name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop, 'release/**', 'hotfix/**']
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make fmt build
      - name: Verify module files
        run: |
          go mod tidy -diff
          go mod verify

  golangci:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --config .golangci-lint.yml --timeout 10m
      - name: Validate GitHub workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # v1.7.12 predates GitHub's native coverage permission. Ignore only
          # that known scope diagnostic; retain all other workflow checks.
          actionlint -color -ignore 'unknown permission scope "code-quality"'
      - name: Test release branch policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Run tests with race detection and coverage
        run: |
          set -euo pipefail
          mkdir -p coverage
          go test -race -covermode=atomic -coverprofile=coverage/coverage.txt -json ./... | tee coverage/gotest.json
      - name: Generate coverage reports
        run: |
          set -euo pipefail
          go tool cover -func=coverage/coverage.txt | tee coverage/coverage-summary.txt
          go tool cover -html=coverage/coverage.txt -o coverage/coverage.html
          go install github.com/boumenot/gocover-cobertura@4afa1205ab3b54ae098dd4724c1657aad10f7484 # v1.5.0
          gocover-cobertura < coverage/coverage.txt > coverage/coverage.xml
          {
            echo '## Coverage'
            echo '```'
            tail -n 1 coverage/coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Check imported packages for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck -scan=package ./...

  checks:
    name: CI checks
    if: always()
    needs: [build, golangci, coverage, vulnerabilities]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          BUILD: ${{ needs.build.result }}
          LINT: ${{ needs.golangci.result }}
          TESTS: ${{ needs.coverage.result }}
          SECURITY: ${{ needs.vulnerabilities.result }}
        run: test "$BUILD" = success && test "$LINT" = success && test "$TESTS" = success && test "$SECURITY" = success

  reports:
    name: Publish test and coverage reports
    needs: coverage
    # Forks still get test/coverage artifacts. Only trusted repository events
    # enter this separate job with report-writing permissions; it runs no Go code.
    if: >-
      !cancelled() && github.actor != 'dependabot[bot]' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      code-quality: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-report
          path: coverage/
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Go Tests
          path: coverage/gotest.json
          reporter: golang-json
          fail-on-error: false
      - uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1.4.1
        if: needs.coverage.result == 'success'
        with:
          file: coverage/coverage.xml
          language: Go
          label: code-coverage/go
          fail-on-error: false
