project_name: gophlare
version: 2
env:
  - GO111MODULE=on
builds:
  - env: [CGO_ENABLED=0]
    id: gophlare
    binary: gophlare
    flags:
      - -trimpath
      - -mod=readonly
    ldflags: |
      -s -w -X github.com/mr-pmillz/gophlare/internal/version.version=v{{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: tgz

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

dockers:
  - image_templates:
      - "ghcr.io/mr-pmillz/{{ .ProjectName }}:{{ .Tag }}-amd64"
      - "ghcr.io/mr-pmillz/{{ .ProjectName }}:latest-amd64"
    goarch: amd64
    dockerfile: goreleaser.dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.url=https://github.com/mr-pmillz/{{.ProjectName}}"
      - "--label=org.opencontainers.image.source=https://github.com/mr-pmillz/{{.ProjectName}}"
      - "--platform=linux/amd64"
    extra_files:
      - entrypoint.sh
  - image_templates:
      - "ghcr.io/mr-pmillz/{{ .ProjectName }}:{{ .Tag }}-arm64"
      - "ghcr.io/mr-pmillz/{{ .ProjectName }}:latest-arm64"
    goarch: arm64
    dockerfile: goreleaser.dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.url=https://github.com/mr-pmillz/{{.ProjectName}}"
      - "--label=org.opencontainers.image.source=https://github.com/mr-pmillz/{{.ProjectName}}"
      - "--platform=linux/arm64"
    extra_files:
      - entrypoint.sh

docker_manifests:
  - name_template: "ghcr.io/mr-pmillz/{{ .ProjectName }}:{{ .Tag }}"
    image_templates:
      - "ghcr.io/mr-pmillz/{{ .ProjectName }}:{{ .Tag }}-amd64"
      - "ghcr.io/mr-pmillz/{{ .ProjectName }}:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/mr-pmillz/{{ .ProjectName }}:latest"
    image_templates:
      - "ghcr.io/mr-pmillz/{{ .ProjectName }}:{{ .Tag }}-amd64"
      - "ghcr.io/mr-pmillz/{{ .ProjectName }}:{{ .Tag }}-arm64"
